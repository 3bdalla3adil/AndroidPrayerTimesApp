plugins {
    id 'com.android.application'
}

android {
    compileSdkVersion 31
    buildToolsVersion "30.0.3"

    defaultConfig {
        applicationId "com.example.target"
        minSdkVersion 21
        targetSdkVersion 31
        versionCode 2
        versionName "2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

def quranAssetsDir = file("src/main/assets/quran")

tasks.register("generateQuranAssets") {
    outputs.dir(quranAssetsDir)
    doLast {
        quranAssetsDir.mkdirs()

        (1..114).each { chapter ->
            def name = String.format("%03d.json", chapter)
            def target = new File(quranAssetsDir, name)
            if (target.exists() && target.length() > 100) {
                return
            }

            def url = new URL(
                    "https://raw.githubusercontent.com/semarketir/quranjson/master/source/surah/surah_" +
                    chapter + ".json"
            )
            def connection = url.openConnection()
            connection.connectTimeout = 15000
            connection.readTimeout = 30000
            connection.setRequestProperty("User-Agent", "AndroidPrayerTimesApp-QuranBuilder/1.0")

            target.withOutputStream { output ->
                connection.inputStream.withCloseable { input ->
                    input.transferTo(output)
                }
            }
        }
    }
}

preBuild.dependsOn(generateQuranAssets)

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.4.0'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.2'
    implementation 'androidx.navigation:navigation-fragment:2.3.5'
    implementation 'androidx.navigation:navigation-ui:2.3.5'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'joda-time:joda-time:2.9.6'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation group: 'com.github.msarhan', name: 'ummalqura-calendar', version: '1.1.9'
    implementation 'com.jakewharton:butterknife:10.2.3'
    annotationProcessor 'com.jakewharton:butterknife-compiler:10.2.3'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.4.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}
