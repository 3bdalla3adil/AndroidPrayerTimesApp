name: Flutter CI

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare shared Flutter assets
        uses: ./.github/actions/prepare-flutter-assets

      - name: Prepare bundled Athan sounds
        run: bash tool/fetch_athan_sounds.sh

      - name: Get dependencies
        run: flutter pub get

      - name: Validate bundled Athan audio
        run: |
          set -e
          for f in assets/audio/azan.mp3 assets/audio/azan_madinah.mp3 assets/audio/azan_dubai.mp3 assets/audio/azan_fajr_madinah.mp3; do
            test -s "$f"
            file "$f"
          done

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test

  build-android:
    name: Build Android APK and App Bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          set -e
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare shared Flutter assets
        uses: ./.github/actions/prepare-flutter-assets

      - name: Bootstrap Android and install notification sounds
        run: bash tool/bootstrap_android.sh

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Android launcher icon and splash screen
        run: |
          dart run flutter_launcher_icons -f flutter_launcher_icons_android.yaml
          dart run flutter_native_splash:create

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify Athan sounds in APK resources
        run: |
          set -e
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          for sound in azan azan_madinah azan_dubai azan_fajr_madinah; do
            echo "Checking $sound"
            if unzip -l "$APK" | grep -Eq "res/raw/$sound\\.mp3$"; then
              echo "ZIP contains res/raw/$sound.mp3"
            else
              AAPT2="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)"
              test -x "$AAPT2"
              "$AAPT2" dump resources "$APK" | grep -Eq "raw/$sound|raw.*$sound"
              echo "AAPT2 resource table contains raw/$sound"
            fi
          done

      - name: Build release App Bundle
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: salawat-quran-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: salawat-quran-release-aab
          path: flutter_app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

  ios-signing-not-configured:
    name: iOS signing credentials not configured
    if: ${{ vars.ENABLE_IOS_SIGNING != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain skipped signed IPA build
        run: |
          echo "::warning::Signed IPA build was skipped because repository variable ENABLE_IOS_SIGNING is not set to true."
          echo "To publish an installable IPA, configure the Apple signing secrets and set ENABLE_IOS_SIGNING=true."

  build-ios:
    name: Build signed iOS IPA
    # Apple signing assets are private release credentials. Keep CI green on
    # branches where they are not configured, without producing an unsigned IPA.
    if: ${{ vars.ENABLE_IOS_SIGNING == 'true' }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: flutter_app
    env:
      IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'ad-hoc' }}
      IOS_SIGNING_IDENTITY: ${{ vars.IOS_SIGNING_IDENTITY || 'Apple Distribution' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Apple signing configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for key in IOS_BUNDLE_ID IOS_TEAM_ID IOS_CERTIFICATE_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64; do
            if [ -z "${!key:-}" ]; then missing+=("$key"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Installable iOS IPA requires Apple signing secrets: ${missing[*]}. Configure an Apple Distribution .p12 certificate and a matching provisioning profile (including the target device for ad-hoc installs). Unsigned IPAs are not published."
            exit 1
          fi
          case "$IOS_EXPORT_METHOD" in
            ad-hoc|development|app-store-connect|enterprise) ;;
            *) echo "::error::Unsupported IOS_EXPORT_METHOD: $IOS_EXPORT_METHOD"; exit 1 ;;
          esac

      - name: Prepare shared Flutter assets
        uses: ./.github/actions/prepare-flutter-assets

      - name: Generate iOS platform
        run: flutter create . --platforms=ios --org "com.salawat_quran" --project-name "salawat_quran"

      - name: Prepare bundled Athan sounds
        run: bash tool/fetch_athan_sounds.sh

      - name: Install FFmpeg for iOS notification clips
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            brew install ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe

      - name: Prepare iOS Athan notification sounds
        run: bash tool/prepare_ios_athan_sounds.sh

      - name: Add notification sounds to iOS app resources
        run: |
          set -e
          for sound in azan azan_madinah azan_dubai azan_fajr_madinah; do
            test -s "assets/audio/$sound.mp3"
            test -s "ios/Runner/$sound.wav"
          done
          gem install xcodeproj --no-document
          ruby - <<'RUBY'
          require 'xcodeproj'
          project_path = 'ios/Runner.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          target = project.targets.find { |t| t.name == 'Runner' }
          group = project.main_group.find_subpath('Runner', true)
          phase = target.resources_build_phase
          ['azan.wav', 'azan_madinah.wav', 'azan_dubai.wav', 'azan_fajr_madinah.wav'].each do |name|
            file = group.files.find { |f| f.path == name }
            file ||= group.new_file(name)
            phase.add_file_reference(file) unless phase.files.any? { |b| b.file_ref == file }
          end
          project.save
          RUBY

      - name: Configure iOS permissions
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string Allow Quran Prayer Companion to use your location for prayer times and Qibla direction." ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string Allow Quran Prayer Companion to use location for prayer times and Qibla direction." ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string Use Face ID to unlock Quran Prayer Companion." ios/Runner/Info.plist || true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate iOS launcher icon and splash screen
        run: |
          test -f ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-20x20@1x.png
          dart run flutter_launcher_icons -f flutter_launcher_icons_ios.yaml
          dart run flutter_native_splash:create

      - name: Import Apple signing certificate and provisioning profile
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/ios-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERT_PATH="$RUNNER_TEMP/ios-signing-certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/ios-provisioning-profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/ios-provisioning-profile.plist"

          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          test -s "$CERT_PATH" && test -s "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$PROFILE_PLIST")
          PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")
          case "$PROFILE_APP_ID" in
            "$PROFILE_TEAM.$IOS_BUNDLE_ID"|"$PROFILE_TEAM".*) ;;
            *) echo "::error::Provisioning profile application identifier does not match expected bundle ID/team."; exit 1 ;;
          esac
          if [ "$PROFILE_TEAM" != "$IOS_TEAM_ID" ]; then
            echo "::error::Provisioning profile team ($PROFILE_TEAM) does not match IOS_TEAM_ID."
            exit 1
          fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "profile_uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"
          echo "profile_name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          echo "profile_path=$PROFILE_PATH" >> "$GITHUB_OUTPUT"
          echo "keychain_path=$KEYCHAIN_PATH" >> "$GITHUB_OUTPUT"

      - name: Prepare iOS Flutter project
        run: flutter build ios --config-only --release --no-codesign

      - name: Build signed iOS archive
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/Runner.xcarchive \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$IOS_SIGNING_IDENTITY" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="${{ steps.signing.outputs.profile_name }}" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            archive

      - name: Export signed IPA
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$IOS_EXPORT_METHOD</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>$IOS_SIGNING_IDENTITY</string>
            <key>provisioningProfiles</key><dict>
              <key>$IOS_BUNDLE_ID</key><string>${{ steps.signing.outputs.profile_name }}</string>
            </dict>
            <key>compileBitcode</key><false/>
            <key>stripSwiftSymbols</key><true/>
          </dict></plist>
          PLIST
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath build/ios/Runner.xcarchive \
            -exportPath build/ios/export \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          IPA_PATH="$(find build/ios/export -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH" && test -s "$IPA_PATH"
          cp "$IPA_PATH" salawat-quran.ipa

      - name: Verify IPA is signed and provisioned
        run: |
          set -euo pipefail
          IPA_PATH="salawat-quran.ipa"
          unzip -t "$IPA_PATH"
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          unzip -q "$IPA_PATH" -d "$TMP_DIR"
          APP_PATH="$TMP_DIR/Payload/Runner.app"
          test -d "$APP_PATH"
          test -s "$APP_PATH/embedded.mobileprovision"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          security cms -D -i "$APP_PATH/embedded.mobileprovision" > "$TMP_DIR/profile.plist"
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$TMP_DIR/profile.plist")
          case "$PROFILE_APP_ID" in
            *."$IOS_BUNDLE_ID"|*.*) ;;
            *) echo "::error::The exported IPA has an invalid application identifier."; exit 1 ;;
          esac
          for sound in azan azan_madinah azan_dubai azan_fajr_madinah; do
            test -s "$APP_PATH/$sound.wav"
            duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$APP_PATH/$sound.wav")"
            python3 -c "d=float('$duration'); assert 0 < d < 30, d"
          done

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: salawat-quran-release-ipa
          path: flutter_app/salawat-quran.ipa
          if-no-files-found: error
          retention-days: 30
