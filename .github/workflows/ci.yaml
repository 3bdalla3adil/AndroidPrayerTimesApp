name: Flutter CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Flutter and offline Quran assets
        uses: ./.github/actions/prepare-flutter-assets

      - name: Prepare Athan source assets
        run: bash tool/fetch_athan_sounds.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test

  build-android:
    name: Build release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare Flutter and offline Quran assets
        uses: ./.github/actions/prepare-flutter-assets

      - name: Prepare Android project
        run: bash tool/bootstrap_android.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icon and splash screen
        run: |
          dart run flutter_launcher_icons -f flutter_launcher_icons_android.yaml
          dart run flutter_native_splash:create

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify release APK
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          unzip -t "$APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: salawat-quran-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 1

  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Flutter and offline Quran assets
        uses: ./.github/actions/prepare-flutter-assets

      - name: Generate iOS project
        run: flutter create . --platforms=ios --org com.salawat_quran --project-name salawat_quran

      - name: Disable signing for unsigned iOS CI build
        run: bash tool/disable_ios_signing_for_ci.sh

      - name: Configure foreground location permission
        run: bash tool/configure_ios_location_permissions.sh

      - name: Prepare iOS Athan notification sounds
        run: |
          set -euo pipefail
          bash tool/fetch_athan_sounds.sh
          if ! command -v ffmpeg >/dev/null 2>&1; then
            brew install ffmpeg
          fi
          # The iOS project is generated earlier in this job, so the script can
          # register the converted WAV files in Runner's Copy Bundle Resources.
          bash tool/prepare_ios_athan_sounds.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icon and splash screen
        run: |
          test -f ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-20x20@1x.png
          dart run flutter_launcher_icons -f flutter_launcher_icons_ios.yaml
          dart run flutter_native_splash:create

      - name: Build iOS app without code signing
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH="$(find build/ios -type d -path '*/Build/Products/Release-iphoneos/Runner.app' -print -quit)"
          fi
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist"
          rm -rf Payload salawat-quran-unsigned.ipa
          mkdir -p Payload
          ditto "$APP_PATH" Payload/Runner.app
          /usr/bin/zip -qry salawat-quran-unsigned.ipa Payload
          unzip -t salawat-quran-unsigned.ipa
          unzip -l salawat-quran-unsigned.ipa | grep -q 'Payload/Runner.app/Info.plist'
          test -s salawat-quran-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: salawat-quran-release-ipa-unsigned
          path: flutter_app/salawat-quran-unsigned.ipa
          if-no-files-found: error
          retention-days: 1

  publish-artifacts:
    name: Publish combined mobile artifacts
    runs-on: ubuntu-latest
    needs:
      - analyze-and-test
      - build-android
      - build-ios
    if: ${{ success() }}
    permissions:
      contents: read
    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: salawat-quran-release-apk
          path: dist/android

      - name: Download unsigned iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: salawat-quran-release-ipa-unsigned
          path: dist/ios

      - name: Verify and package mobile releases
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/android/app-release.apk
          test -s dist/ios/salawat-quran-unsigned.ipa
          unzip -t dist/android/app-release.apk
          unzip -t dist/ios/salawat-quran-unsigned.ipa
          mkdir -p dist/package
          cp dist/android/app-release.apk dist/package/salawat-quran-release.apk
          cp dist/ios/salawat-quran-unsigned.ipa dist/package/salawat-quran-unsigned.ipa
          cat > dist/package/README.txt <<'EOF'
          Salawat Quran mobile build artifacts
          - salawat-quran-release.apk: Android release APK
          - salawat-quran-unsigned.ipa: unsigned iOS IPA; signing is required before normal device installation
          EOF
          cd dist/package
          zip -qry ../salawat-quran-mobile-release.zip .

      - name: Publish combined mobile release artifact
        uses: actions/upload-artifact@v4
        with:
          name: salawat-quran-mobile-release
          path: dist/salawat-quran-mobile-release.zip
          if-no-files-found: error
          retention-days: 1
