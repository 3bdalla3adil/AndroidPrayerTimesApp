name: Flutter CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate 604-page offline Mushaf
        run: bash tool/generate_madinah_mushaf.sh

      - name: Fetch KFGQPC Hafs Quran font
        run: bash tool/fetch_quran_font.sh

      - name: Prepare bundled Athan sounds
        run: bash tool/fetch_athan_sounds.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Validate bundled Athan audio
        run: |
          set -e
          for f in assets/audio/azan.mp3 assets/audio/azan_madinah.mp3 assets/audio/azan_dubai.mp3 assets/audio/azan_fajr_madinah.mp3; do
            test -s "$f"
            file "$f"
          done

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test

  build-android:
    name: Build Android APK and App Bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch KFGQPC Hafs Quran font
        run: bash tool/fetch_quran_font.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Bootstrap Android project and sounds
        run: bash tool/bootstrap_android.sh

      - name: Generate 604-page offline Mushaf
        run: bash tool/generate_madinah_mushaf.sh

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify Athan sounds in APK resources
        run: |
          set -e
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          for sound in azan azan_madinah azan_dubai azan_fajr_madinah; do
            echo "Checking $sound"
            if unzip -l "$APK" | grep -Eq "res/raw/$sound\\.mp3$"; then
              echo "ZIP contains res/raw/$sound.mp3"
            else
              AAPT2="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)"
              test -x "$AAPT2"
              "$AAPT2" dump resources "$APK" | grep -Eq "raw/$sound|raw.*$sound"
              echo "AAPT2 resource table contains raw/$sound"
            fi
          done

      - name: Build release App Bundle
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: salawat-quran-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: salawat-quran-release-aab
          path: flutter_app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

  build-ios:
    name: Build iOS unsigned IPA
    runs-on: macos-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch KFGQPC Hafs Quran font
        run: bash tool/fetch_quran_font.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Generate iOS platform
        run: flutter create . --platforms=ios --org "com.salawat_quran" --project-name "salawat_quran"

      - name: Prepare bundled Athan sounds
        run: bash tool/fetch_athan_sounds.sh

      - name: Install ffmpeg for iOS Athan notification clips
        run: brew install ffmpeg

      - name: Prepare iOS Athan notification sounds
        run: bash tool/prepare_ios_athan_sounds.sh

      - name: Install bundled Athan sounds for iOS
        run: |
          set -e
          for sound in azan azan_madinah azan_dubai azan_fajr_madinah; do
            test -s "assets/audio/$sound.mp3"
            test -s "ios/Runner/$sound.wav"
          done
          gem install xcodeproj --no-document
          ruby - <<'RUBY'
          require 'xcodeproj'
          project_path = 'ios/Runner.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          target = project.targets.find { |t| t.name == 'Runner' }
          group = project.main_group.find_subpath('Runner', true)
          phase = target.resources_build_phase
          ['azan.wav', 'azan_madinah.wav', 'azan_dubai.wav', 'azan_fajr_madinah.wav'].each do |name|
            file = group.files.find { |f| f.path == name }
            file ||= group.new_file(name)
            phase.add_file_reference(file) unless phase.files.any? { |b| b.file_ref == file }
          end
          project.save
          RUBY

      - name: Configure iOS permissions
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string Allow Quran Prayer Companion to use your location for prayer times and Qibla direction." ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string Allow Quran Prayer Companion to use location for prayer times and Qibla direction." ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string Use Face ID to unlock Quran Prayer Companion." ios/Runner/Info.plist || true

      - name: Generate 604-page offline Mushaf
        run: bash tool/generate_madinah_mushaf.sh

      - name: Get dependencies
        run: flutter pub get

      - name: Prepare iOS Flutter project
        run: flutter build ios --config-only --release --no-codesign

      - name: Disable Xcode code signing for CI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          project = Path("ios/Runner.xcodeproj/project.pbxproj")
          text = project.read_text()
          text = text.replace(
              "buildSettings = {",
              "buildSettings = {\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;",
          )
          project.write_text(text)
          PY

      - name: Build iOS device app without code signing
        run: |
          set -e
          rm -rf build/ios
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: Verify Athan sounds in iOS app
        run: |
          set -e
          APP_PATH="build/ios/Build/Products/Release-iphoneos/Runner.app"
          for sound in azan azan_madinah azan_dubai azan_fajr_madinah; do
            test -s "$APP_PATH/$sound.wav"
            # Apple requires custom notification sounds to remain under 30s.
            duration="$(/usr/local/bin/ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$APP_PATH/$sound.wav" 2>/dev/null || /opt/homebrew/bin/ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$APP_PATH/$sound.wav")"
            python3 -c "d=float('$duration'); assert 0 < d < 30, d"
          done

      - name: Package unsigned IPA
        run: |
          set -e
          rm -rf Payload app-release-unsigned.ipa
          mkdir -p Payload
          APP_PATH="build/ios/Build/Products/Release-iphoneos/Runner.app"
          test -d "$APP_PATH"
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry app-release-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: salawat-quran-release-ipa-unsigned
          path: flutter_app/app-release-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
