name: Publish AndroidPrayerTimesApp Downloads

on:
  push:
    branches: [main]
    paths:
      - "flutter_app/**"
      - ".github/workflows/publish-downloads.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-salawat-downloads
  cancel-in-progress: false

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: true
          cache-dependency-path: flutter_app/pubspec.lock
      - name: Prepare Android project
        run: bash tool/bootstrap_android.sh
      - name: Install dependencies
        run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release --dart-define=APP_ENV=production
      - name: Stage APK
        run: |
          mkdir -p ../download-output
          cp build/app/outputs/flutter-apk/app-release.apk ../download-output/salawat-quran.apk
      - uses: actions/upload-artifact@v4
        with:
          name: salawat-android-download
          path: download-output/salawat-quran.apk
          if-no-files-found: error
          retention-days: 3

  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: true
          cache-dependency-path: flutter_app/pubspec.lock
      - name: Generate iOS platform files
        run: flutter create --platforms=ios .
      - name: Install dependencies
        run: flutter pub get
      - name: Build iOS app without Apple signing
        run: flutter build ios --release --no-codesign --dart-define=APP_ENV=production
      - name: Package unsigned IPA
        run: |
          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa/Payload ../download-output
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
          cd build/ios/ipa
          /usr/bin/zip -qry ../../../../download-output/salawat-quran-unsigned.ipa Payload
          test -s ../../../../download-output/salawat-quran-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: salawat-ios-download
          path: flutter_app/download-output/salawat-quran-unsigned.ipa
          if-no-files-found: error
          retention-days: 3

  publish-release:
    name: Publish stable download links
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: salawat-android-download
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: salawat-ios-download
          path: dist
      - name: Add download notes
        run: |
          cat > dist/README.txt <<'EOF'
          Salawat / AndroidPrayerTimesApp downloads
          APK: Android package for direct installation on a compatible Android device.
          IPA: Unsigned iOS package. It cannot be installed on an iPhone until signed with an Apple developer certificate and matching provisioning profile.
          These builds are generated from the main branch.
          EOF
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: portfolio-downloads
          name: Salawat app downloads
          body: |
            Download builds for the Salawat / AndroidPrayerTimesApp project.

            - Android APK: install on a compatible Android device.
            - iOS IPA: unsigned build; Apple signing and provisioning are required before installation.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            dist/salawat-quran.apk
            dist/salawat-quran-unsigned.ipa
            dist/README.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
