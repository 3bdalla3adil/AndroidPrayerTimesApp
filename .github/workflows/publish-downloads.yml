name: Publish AndroidPrayerTimesApp Prerelease Downloads

on:
  workflow_run:
    workflows: ["Flutter CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-salawat-downloads
  cancel-in-progress: false

jobs:
  publish-release:
    name: Publish verified release artifacts
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Select a successful run containing all release artifacts
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          required=(salawat-quran-release-apk salawat-quran-release-ipa salawat-quran-release-aab)

          check_artifacts() {
            local id="$1" names
            names="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts?per_page=100" --jq '[.artifacts[] | select(.expired == false) | .name] | unique | .[]')"
            for artifact in "${required[@]}"; do
              if ! grep -Fxq "$artifact" <<< "$names"; then
                return 1
              fi
            done
            return 0
          }

          run_id=""
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            candidate="$EVENT_RUN_ID"
            if check_artifacts "$candidate"; then
              run_id="$candidate"
            else
              echo "::error::The successful main-branch Flutter CI run $candidate does not contain all required artifacts: ${required[*]}. The signed iOS build may have failed or its signing secrets/profile are not configured. No unsigned IPA will be published as installable."
              exit 1
            fi
          else
            while IFS= read -r candidate; do
              [ -n "$candidate" ] || continue
              if check_artifacts "$candidate"; then
                run_id="$candidate"
                break
              fi
            done < <(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yaml/runs?branch=main&per_page=30" --jq '.workflow_runs | map(select(.conclusion == "success" and .head_branch == "main")) | .[].id')
          fi

          if [ -z "$run_id" ]; then
            echo "::error::No successful main-branch Flutter CI run with APK, signed IPA, and AAB artifacts was found. Configure the IOS_BUNDLE_ID, IOS_TEAM_ID, IOS_CERTIFICATE_BASE64, IOS_CERTIFICATE_PASSWORD, and IOS_PROVISIONING_PROFILE_BASE64 repository secrets, then rerun Flutter CI."
            exit 1
          fi

          echo "Selected run $run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: salawat-quran-release-apk
          path: downloaded/apk
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download signed iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: salawat-quran-release-ipa
          path: downloaded/ipa
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Android App Bundle
        uses: actions/download-artifact@v4
        with:
          name: salawat-quran-release-aab
          path: downloaded/aab
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="$(find downloaded/apk -type f -name '*.apk' -print -quit)"
          ipa="$(find downloaded/ipa -type f -name '*.ipa' -print -quit)"
          aab="$(find downloaded/aab -type f -name '*.aab' -print -quit)"
          test -n "$apk" && test -s "$apk"
          test -n "$ipa" && test -s "$ipa"
          test -n "$aab" && test -s "$aab"

          unzip -t "$apk"
          unzip -t "$ipa"
          unzip -t "$aab"

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          unzip -q "$ipa" -d "$tmp"
          app="$tmp/Payload/Runner.app"
          test -d "$app"
          test -s "$app/Info.plist"
          test -s "$app/embedded.mobileprovision"
          test -s "$app/_CodeSignature/CodeResources"
          python3 - "$app/Info.plist" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], "rb") as stream:
              info = plistlib.load(stream)
          assert info.get("CFBundleIdentifier"), "IPA app bundle is missing its bundle identifier"
          assert info.get("CFBundleExecutable"), "IPA app bundle is missing its executable name"
          print("Validated signed IPA app bundle:", info["CFBundleIdentifier"])
          PY

          cp "$apk" dist/salawat-quran.apk
          cp "$ipa" dist/salawat-quran.ipa
          cp "$aab" dist/salawat-quran.aab
          cat > dist/README.txt <<'EOF'
          Salawat / AndroidPrayerTimesApp prerelease downloads

          salawat-quran.apk: Android release APK.
          salawat-quran.aab: Android release App Bundle.
          salawat-quran.ipa: Signed and provisioned iOS app package. Installation is limited to devices/installation methods allowed by the Apple signing identity and provisioning profile.

          Artifacts are copied from a successful Flutter CI run on main. The workflow validates all archives and checks the IPA's app bundle, embedded provisioning profile, and code-signature resource manifest before publication.
          EOF

      - name: Publish prerelease assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: portfolio-downloads
          name: Salawat app downloads
          body: |
            Release downloads copied from a successful Flutter CI run on main.

            - Android APK: release installation package for compatible Android devices.
            - Android AAB: release App Bundle.
            - Signed iOS IPA: signed and provisioned package. Installation is limited to devices and distribution methods permitted by the configured Apple signing identity and provisioning profile.

            All three archives are validated before publication. The iOS package must contain its app bundle, embedded provisioning profile, and code-signature resource manifest.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            dist/salawat-quran.apk
            dist/salawat-quran.ipa
            dist/salawat-quran.aab
            dist/README.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
