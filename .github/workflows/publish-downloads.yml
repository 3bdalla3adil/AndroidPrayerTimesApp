name: Publish AndroidPrayerTimesApp Downloads

on:
  push:
    branches: [main]
    paths:
      - "flutter_app/**"
      - ".github/workflows/publish-downloads.yml"
  workflow_run:
    workflows: ["Flutter CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-salawat-downloads
  cancel-in-progress: false

jobs:
  publish-release:
    name: Publish verified Flutter CI artifacts
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Select successful Flutter CI run
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            run_id="${{ github.event.workflow_run.id }}"
          else
            run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yaml/runs?branch=main&per_page=20" --jq '.workflow_runs | map(select(.conclusion == "success" and .head_branch == "main")) | first | .id')"
          fi
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error::No successful main-branch Flutter CI run was found."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Using successful Flutter CI run $run_id"

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: salawat-quran-release-apk
          path: downloaded/apk
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download iOS IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: salawat-quran-release-ipa
          path: downloaded/ipa
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Android App Bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: salawat-quran-release-aab
          path: downloaded/aab
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare stable release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="$(find downloaded/apk -type f -name '*.apk' -print -quit)"
          ipa="$(find downloaded/ipa -type f -name '*.ipa' -print -quit)"
          aab="$(find downloaded/aab -type f -name '*.aab' -print -quit)"
          test -n "$apk" && test -s "$apk"
          test -n "$ipa" && test -s "$ipa"
          test -n "$aab" && test -s "$aab"
          cp "$apk" dist/salawat-quran.apk
          cp "$ipa" dist/salawat-quran.ipa
          cp "$aab" dist/salawat-quran.aab
          cat > dist/README.txt <<'EOF'
          Salawat / AndroidPrayerTimesApp release downloads

          APK: Android installation package.
          AAB: Android App Bundle for Play Console/internal testing.
          IPA: Signed iOS app package. Installation is limited to devices or distribution channels allowed by the embedded Apple provisioning profile.

          These files are copied from a successful Flutter CI run on the main branch.
          EOF

      - name: Publish stable release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: portfolio-downloads
          name: Salawat app downloads
          body: |
            Downloads copied from a successful Flutter CI run on main.

            - Android APK: install on a compatible Android device.
            - Android AAB: use for Play Console/internal testing.
            - iOS IPA: signed with the configured Apple certificate and provisioning profile; installability depends on the selected distribution method and profile.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            dist/salawat-quran.apk
            dist/salawat-quran.ipa
            dist/salawat-quran.aab
            dist/README.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
