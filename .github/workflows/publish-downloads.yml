name: Publish AndroidPrayerTimesApp Prerelease Downloads

on:
  workflow_run:
    workflows: ["Flutter CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-salawat-downloads
  cancel-in-progress: false

jobs:
  publish-release:
    name: Publish successful branch build artifacts
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'refactor/quran-reader-architecture')
    runs-on: ubuntu-latest
    steps:
      - name: Select successful reference-branch run
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            run_id="${{ github.event.workflow_run.id }}"
          else
            run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yaml/runs?branch=refactor/quran-reader-architecture&per_page=30" --jq '.workflow_runs | map(select(.conclusion == "success" and .head_branch == "refactor/quran-reader-architecture")) | first | .id')"
          fi
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error::No successful Flutter CI run was found on refactor/quran-reader-architecture."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: salawat-quran-release-apk
          path: downloaded/apk
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download unsigned iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: salawat-quran-release-ipa-unsigned
          path: downloaded/ipa
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and prepare prerelease assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="$(find downloaded/apk -type f -name '*.apk' -print -quit)"
          ipa="$(find downloaded/ipa -type f -name '*.ipa' -print -quit)"
          test -n "$apk" && test -s "$apk"
          test -n "$ipa" && test -s "$ipa"

          unzip -t "$apk"
          unzip -t "$ipa"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          unzip -q "$ipa" -d "$tmp"
          app="$tmp/Payload/Runner.app"
          test -d "$app"
          python3 - "$app/Info.plist" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], "rb") as stream:
              info = plistlib.load(stream)
          assert info.get("CFBundleIdentifier"), "IPA app bundle is missing its bundle identifier"
          PY

          cp "$apk" dist/salawat-quran.apk
          cp "$ipa" dist/salawat-quran-unsigned.ipa
          cat > dist/README.txt <<'EOF'
          Salawat / AndroidPrayerTimesApp prerelease downloads

          salawat-quran.apk: Android release APK.
          salawat-quran-unsigned.ipa: Unsigned iOS package for development/testing workflows only. It is not directly installable on a normal iPhone until it is signed and provisioned with a valid Apple development/distribution identity.

          Files are copied from a successful Flutter CI run on refactor/quran-reader-architecture.
          Both archives are checked, and the IPA app bundle metadata is validated before publication.
          EOF

      - name: Publish prerelease assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: portfolio-downloads
          name: Salawat app downloads
          body: |
            Downloads copied from a successful Flutter CI run on refactor/quran-reader-architecture.

            - Android APK: release installation package for compatible Android devices.
            - Unsigned iOS IPA: development/testing package only. It is not directly installable on a normal iPhone until signed and provisioned with a valid Apple identity and profile.

            The workflow checks both archives and validates the IPA app bundle metadata before publishing.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            dist/salawat-quran.apk
            dist/salawat-quran-unsigned.ipa
            dist/README.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
