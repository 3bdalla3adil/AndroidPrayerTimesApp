name: Publish Android APK for Public Download

on:
  workflow_run:
    workflows: ["Flutter CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-salawat-public-apk
  cancel-in-progress: false

jobs:
  publish-android:
    name: Publish verified public Android APK
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Verify Flutter analysis, tests, and Android build
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="$EVENT_RUN_ID"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yaml/runs?branch=main&per_page=30" --jq '.workflow_runs | map(select(.conclusion == "success" and .head_branch == "main")) | .[0].id // empty')"
          fi
          test -n "$run_id" || { echo "::error::No successful main-branch Flutter CI run found."; exit 1; }

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > jobs.json
          python3 - jobs.json <<'PY'
          import json, sys
          jobs = json.load(open(sys.argv[1]))["jobs"]
          required = ["Analyze and test", "Build Android APK and App Bundle"]
          for name in required:
              matches = [job for job in jobs if job["name"] == name]
              if not matches or matches[-1]["conclusion"] != "success":
                  raise SystemExit(f"Required CI job did not succeed: {name}")
          print("Analysis, tests, and Android release build passed.")
          PY

          names="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" --jq '[.artifacts[] | select(.expired == false) | .name] | .[]')"
          grep -Fxq "salawat-quran-release-apk" <<< "$names" || { echo "::error::Release APK artifact is missing."; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: salawat-quran-release-apk
          path: downloaded/apk
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and prepare public APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find downloaded/apk -type f -name '*.apk' -print -quit)"
          test -n "$apk" && test -s "$apk"
          unzip -t "$apk"
          mkdir -p dist
          cp "$apk" dist/salawat-quran.apk
          cat > dist/README.txt <<'EOF'
          Salawat — Android public release

          Download salawat-quran.apk and open it on an Android device to install.
          If prompted, allow installation from the browser or file manager used to open the APK.
          Only install APKs downloaded from this official repository release.
          EOF

      - name: Publish public prerelease assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-public-download
          name: Salawat — Android download
          body: |
            Public Android release of Salawat.

            Download **salawat-quran.apk** below and open it on your Android device to install. Android may ask you to allow installs from the browser or file manager.

            This APK is published only after Flutter analysis, tests, and the Android release build pass on the main branch.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            dist/salawat-quran.apk
            dist/README.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
