name: Prepare shared Flutter assets
description: Set up Flutter and prepare the shared Quran font and offline Mushaf assets.
runs:
  using: composite
  steps:
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: 3.47.5
        cache: true

    - name: Fetch KFGQPC Hafs Quran font
      shell: bash
      working-directory: flutter_app
      run: bash tool/fetch_quran_font.sh

    - name: Generate 604-page offline Mushaf
      shell: bash
      working-directory: flutter_app
      run: bash tool/generate_madinah_mushaf.sh
