name: salawat_quran
description: Offline-first Muslim companion rebuilt in Flutter with a Cupertino-first iOS UI.
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  adhan_dart: ^2.0.1
  geolocator: ^14.1.1
  quran: ^1.2.3
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  flutter_compass: ^0.8.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
  generate: true
  assets:
    - assets/quran/pages/
    - assets/quran/page-index.json
